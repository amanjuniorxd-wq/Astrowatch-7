const CATEGORY_META = {
  india: {label: "Indian politics"},
  global_politics: {label: "World politics"},
  global_economy: {label: "Economy"},
  sports: {label: "Sports"},
};
const CATS = ["india", "global_politics", "global_economy", "sports"];

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function seededRandom(seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) { h = (h * 31 + seedStr.charCodeAt(i)) >>> 0; }
  return function() { h = (h * 1103515245 + 12345) >>> 0; return (h % 100000) / 100000; };
}
function segmentFor(segments, dateStr) {
  for (const s of segments) { if (dateStr >= s.start && dateStr < s.end) return s; }
  return segments[segments.length - 1];
}
function nearestWeekly(dateStr) {
  let best = DATA.weekly_global_resonance[0];
  let bestDiff = Infinity;
  for (const w of DATA.weekly_global_resonance) {
    const diff = Math.abs(new Date(w.date) - new Date(dateStr));
    if (diff < bestDiff) { bestDiff = diff; best = w; }
  }
  return best;
}
function themeFor(domain, lord) {
  const table = {
    politics: {
      sun: "authority, visibility and executive action",
      moon: "public mood and emotional currents",
      mars: "confrontation, assertive moves and sudden action",
      mercury: "communication, negotiation and messaging",
      jupiter: "law, expansion and institutional matters",
      venus: "diplomacy, trade and alliances",
      saturn: "delay, restriction and structural pressure",
      rahu: "disruption, ambition and unconventional moves",
      ketu: "withdrawal, loose ends and quiet transitions",
    },
    economy: {
      sun: "policy visibility and headline decisions",
      moon: "consumer sentiment and market mood swings",
      mars: "sharp volatility and fast, aggressive moves",
      mercury: "data releases, trade flows and negotiation",
      jupiter: "growth, expansion and institutional confidence",
      venus: "trade deals, currency strength and asset stability",
      saturn: "tightening, caution and slower momentum",
      rahu: "speculative surges and unconventional bets",
      ketu: "quiet pullbacks and unwinding positions",
    },
    sports: {
      sun: "commanding, high-visibility performances",
      moon: "form swings tied to momentum and crowd mood",
      mars: "aggressive, high-intensity, dominant performances",
      mercury: "sharp decision-making and tactical precision",
      jupiter: "big-stage success and career-defining moments",
      venus: "flair, popularity and crowd-pleasing performances",
      saturn: "grinding, disciplined, high-endurance performances",
      rahu: "unpredictable, headline-making moments",
      ketu: "quiet patches, away from the spotlight",
    },
  };
  return (table[domain] && table[domain][lord]) || DATA.graha_theme[lord] || lord;
}
function percentileOf(score, key) {
  const all = DATA.weekly_global_resonance.map(function(w){ return w[key].score; }).sort(function(a,b){return a-b;});
  let below = 0;
  for (const s of all) { if (s <= score) below++; }
  return Math.round((below / all.length) * 100);
}
function shareOfSample(lord) {
  const pool = DATA.athlete_pool;
  const n = pool.filter(function(a){ return a.natal_mahadasha_lord === lord; }).length;
  return Math.round((n / pool.length) * 100);
}
function strengthLabel(pct) {
  if (pct >= 80) return "one of the strongest configurations of the period";
  if (pct >= 60) return "a notably strong configuration";
  if (pct >= 40) return "a moderate, fairly typical configuration";
  if (pct >= 20) return "a relatively quiet configuration";
  return "a subdued configuration";
}
function rarityLabel(pct) {
  if (pct >= 30) return "a placement common across many elite athletes";
  if (pct >= 15) return "a placement shared by a meaningful share of elite athletes";
  return "a distinctive, relatively rare placement among elite athletes";
}
const TAG = " (Astrological prediction only.)";
function textFor(cat, dateStr, rand) {
  if (cat === "india") {
    const s = segmentFor(DATA.modi_segments, dateStr);
    return "INDIAN POLITICS: " + s.mahadasha_lord.toUpperCase() + " mahadasha with " + s.antardasha_lord + " antardasha governs this period! Expect Modi's growth-and-welfare push to be driven by " + themeFor("politics", s.mahadasha_lord) + ", coloured by " + themeFor("politics", s.antardasha_lord) + "." + TAG;
  }
  if (cat === "global_politics") {
    const w = nearestWeekly(dateStr);
    const f = w.political.features;
    const pct = percentileOf(w.political.score, "political");
    return "WORLD POLITICS: Moon in " + f.moon_rashi + " (" + f.moon_nakshatra + ") under " + f.mahadasha_lord + " mahadasha, spotlighting " + themeFor("politics", f.mahadasha_lord) + " on the world stage. This reads as " + strengthLabel(pct) + "." + TAG;
  }
  if (cat === "global_economy") {
    const w = nearestWeekly(dateStr);
    const f = w.economic.features;
    const pct = percentileOf(w.economic.score, "economic");
    return "ECONOMY: " + f.mahadasha_lord.toUpperCase() + " mahadasha dominates -- expect " + themeFor("economy", f.mahadasha_lord) + " to drive the economic conversation this week. This reads as " + strengthLabel(pct) + ". No market-direction call is made." + TAG;
  }
  if (cat === "sports") {
    const pool = DATA.athlete_pool;
    const idx = Math.floor(rand() * pool.length);
    const a = pool[idx];
    const pct = shareOfSample(a.natal_mahadasha_lord);
    return "SPORTS: " + a.name.toUpperCase() + "'s natal chart carries a strong " + a.natal_mahadasha_lord + " signature -- " + rarityLabel(pct) + " -- expect " + themeFor("sports", a.natal_mahadasha_lord) + " to define " + a.name + "'s form and media presence this period!" + TAG;
  }
  return "";
}
function render(seedStr) {
  const rand = seededRandom(seedStr);
  const container = document.getElementById("cards");
  container.innerHTML = "";
  CATS.forEach(function(cat) {
    const meta = CATEGORY_META[cat];
    const card = document.createElement("div");
    card.className = "card";
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = meta.label;
    card.appendChild(badge);
    const text = document.createElement("div");
    text.className = "text";
    text.textContent = textFor(cat, todayISO(), rand);
    card.appendChild(text);
    container.appendChild(card);
  });
}
const today = todayISO();
document.getElementById("date-label").textContent = "Today: " + today;
document.getElementById("disclaimer").textContent = DATA.disclaimer;
render(today);
document.getElementById("shuffle-btn").addEventListener("click", function() {
  render(today + "-" + Date.now());
